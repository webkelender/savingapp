<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Savings Countdown</title>
<style>
  :root{
    --bg:#eef6f0; --card:rgba(255,255,255,.88); --text:#12382b; --muted:#6b7f75;
    --g900:#0b4d38; --g700:#0e7a52; --g500:#10a36b; --g200:#d8f0e0; --g100:#e6f4ea;
    --border:#e0ece4; --danger:#d92d3a; --danger-bg:#fdecec; --danger-bd:#f4b9b9;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  body{
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
    min-height:100vh;padding:18px 16px 40px;display:flex;justify-content:center;position:relative;overflow-x:hidden;
    background:
      radial-gradient(260px 200px at -40px -30px,#cfe8d8 0%,transparent 70%),
      radial-gradient(320px 300px at 110% 22%,#d6ecdc 0%,transparent 70%),
      radial-gradient(260px 260px at 105% 102%,#d3eadb 0%,transparent 70%),
      var(--bg);
  }
  .wrap{width:100%;max-width:480px;display:flex;flex-direction:column;gap:14px;position:relative}
  .hidden{display:none !important}

  /* header */
  .head{display:flex;align-items:center;justify-content:center;gap:12px;margin:4px 0 4px}
  .logo{width:64px;height:64px;border-radius:50%;background:#dff1e5;display:grid;place-items:center;flex:0 0 auto}
  .title{font-size:1.85rem;font-weight:800;letter-spacing:-.02em;color:#0d3326;position:relative;line-height:1.1}
  .title span{color:var(--g500)}
  .title svg{position:absolute;left:44%;bottom:-9px;width:56%;height:10px}

  /* goal chips */
  .chips{display:flex;gap:12px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--border);background:rgba(255,255,255,.7);color:var(--text);border-radius:999px;padding:9px 22px;font:inherit;font-size:.9rem;font-weight:700;cursor:pointer;text-align:left;line-height:1.2}
  .chip small{display:block;font-size:.82rem;font-weight:600;color:var(--muted);margin-top:1px}
  .chip.active{background:linear-gradient(135deg,#16a06f,#0b6b4c);border-color:transparent;color:#fff;box-shadow:0 6px 14px rgba(11,107,76,.28)}
  .chip.active small{color:#fff}
  .chip.new{background:transparent;border:1.5px dashed var(--g500);color:var(--text);display:flex;align-items:center;justify-content:center;padding:0 26px;min-height:46px;font-size:.95rem}

  /* hero */
  .hero{position:relative;overflow:hidden;border-radius:26px;color:#fff;
    background:linear-gradient(150deg,#0b5a41 0%,#0a4d38 55%,#0c6a4c 100%);
    box-shadow:0 12px 26px rgba(11,77,56,.28)}
  .hero::before{content:"";position:absolute;right:-70px;top:-80px;width:230px;height:230px;border-radius:50%;background:rgba(255,255,255,.08)}
  .hero::after{content:"";position:absolute;right:-20px;top:-100px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.07)}
  .hero-body{position:relative;padding:20px 20px 16px;z-index:1}
  .pill{display:inline-block;background:#35b77f;color:#06382a;font-weight:800;font-size:1.05rem;padding:5px 18px;border-radius:999px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .still{margin-top:14px;font-size:.78rem;letter-spacing:.26em;font-weight:700;color:#d8efe2}
  .remaining{font-size:3.1rem;font-weight:800;letter-spacing:-.02em;margin:2px 0 10px;font-variant-numeric:tabular-nums;line-height:1.1}
  .bar{height:12px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden}
  .bar>div{height:100%;width:0;background:linear-gradient(90deg,#6ee7b7,#5be0a8);border-radius:99px;transition:width .6s ease}
  .stats{display:flex;align-items:center;margin-top:16px}
  .stat{flex:1;display:flex;align-items:center;gap:8px;font-weight:700;font-size:.92rem;white-space:nowrap}
  .stat.mid{flex-direction:column;gap:0;justify-content:center;text-align:center;border-left:1px solid rgba(255,255,255,.22);border-right:1px solid rgba(255,255,255,.22);padding:2px 6px;line-height:1.25}
  .stat.mid b{font-size:1.15rem}
  .stat.mid span{font-size:.82rem;font-weight:500;color:#d8efe2}
  .stat.mid, .stat.right{justify-content:center}
  .stat.left{padding-right:6px}
  .stat.right{padding-left:8px}
  .strip{position:relative;z-index:1;background:rgba(0,0,0,.16);padding:12px 16px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:.92rem;text-align:center}
  .strip b{font-weight:800}

  /* cards */
  .card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:20px;box-shadow:0 6px 18px rgba(16,100,70,.07);backdrop-filter:blur(6px)}
  .label{font-size:.95rem;font-weight:800;letter-spacing:.01em;text-transform:uppercase;color:#3a4a43}
  .row{display:flex;gap:12px}
  input{flex:1;min-width:0;width:100%;background:#f3f4ee;border:1px solid #e0e4da;color:var(--text);border-radius:18px;padding:0 18px;height:54px;font:inherit;font-size:1.05rem}
  input::placeholder{color:#7c847f}
  input:focus{outline:2px solid var(--g500);border-color:transparent}
  button{font:inherit;cursor:pointer;border:0}
  button:active{transform:scale(.97)}
  .btn-add{background:var(--g900);color:#fff;font-weight:800;font-size:1.1rem;border-radius:18px;padding:0 34px;height:54px}
  .quick{display:flex;gap:12px;margin:14px 0;flex-wrap:wrap}
  .quick button{background:var(--g200);color:var(--g700);font-weight:800;font-size:.95rem;padding:0 20px;height:44px;border-radius:999px}
  .note-wrap{position:relative}
  .note-wrap svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);pointer-events:none}
  .note-wrap input{padding-left:52px}

  /* history */
  .hist-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;background:none;width:100%;text-align:left;color:inherit;padding:0}
  .hist-head svg{transition:transform .2s}
  .hist-head.closed svg{transform:rotate(-90deg)}
  .empty{text-align:center;color:#5b6e65;padding:0 6px;font-size:1.02rem;line-height:1.35}
  .empty svg{display:block;margin:0 auto 6px}
  ul{list-style:none;margin-top:8px;max-height:260px;overflow:auto}
  li{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
  li:last-child{border:0}
  li small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
  li .amt{color:var(--g700);font-weight:800;font-size:1.02rem}
  .del{background:transparent;color:var(--danger);font-size:1.1rem;padding:6px 10px;border-radius:10px}

  /* footer buttons */
  .foot{display:flex;justify-content:space-between;gap:12px;margin-top:2px}
  .pbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:999px;font-weight:800;font-size:1.05rem}
  .pbtn.edit{background:rgba(255,255,255,.7);border:1.5px solid var(--g500);color:var(--text)}
  .pbtn.danger{background:var(--danger-bg);border:1.5px solid var(--danger-bd);color:var(--danger)}
  .pbtn.danger.armed{background:var(--danger);border-color:var(--danger);color:#fff}
  .pbtn.danger.armed svg path{stroke:#fff}

  /* setup */
  .setup label{display:block;font-size:.82rem;font-weight:700;color:var(--muted);margin:14px 0 6px}
  .setup .row{margin-top:20px}
  .btn-main{flex:1;background:var(--g900);color:#fff;font-weight:800;font-size:1.05rem;border-radius:18px;height:54px}
  .btn-ghost{background:transparent;border:1.5px solid var(--border);color:var(--muted);font-weight:700;border-radius:18px;padding:0 20px;height:54px}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#12382b;color:#fff;padding:12px 18px;border-radius:14px;display:flex;gap:16px;align-items:center;font-size:.92rem;box-shadow:0 10px 26px rgba(0,0,0,.28);z-index:10}
  .toast button{background:transparent;color:#6ee7b7;font-weight:800;padding:0}
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div class="logo">
      <svg width="42" height="42" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M17 6c2 3 4 3 7 1 3 2 5 2 7-1-1 5-3 8-4 10H21c-1-2-3-5-4-10z" fill="#e0a526"/>
        <path d="M15 17h18c7 6 10 14 7 21-2 4-7 6-16 6S10 42 8 38c-3-7 0-15 7-21z" fill="#f7b731"/>
        <path d="M19 17h10v3H19z" fill="#c88a12"/>
        <text x="24" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" font-size="20" fill="#1c2b22">₹</text>
      </svg>
    </div>
    <div class="title">Savings <span>Countdown</span>
      <svg viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true"><path d="M2 8 C30 1, 70 1, 98 4" fill="none" stroke="#10a36b" stroke-width="3" stroke-linecap="round"/></svg>
    </div>
  </div>

  <div class="chips" id="chips"></div>

  <!-- Setup / new / edit -->
  <div class="card setup hidden" id="setup">
    <div class="label" id="setupTitle">New countdown</div>
    <label for="gName">What are you saving for?</label>
    <input id="gName" placeholder="e.g. Trip">
    <label for="gAmt">Target amount (₹)</label>
    <input id="gAmt" type="number" min="1" inputmode="decimal" placeholder="e.g. 10000">
    <label for="gDate">Target date (optional)</label>
    <input id="gDate" type="date">
    <div class="row">
      <button class="btn-main" id="startBtn">Start saving</button>
      <button class="btn-ghost" id="cancelBtn">Cancel</button>
    </div>
  </div>

  <!-- Tracker -->
  <div id="tracker" class="hidden" style="flex-direction:column;gap:14px">
    <div class="hero">
      <div class="hero-body">
        <span class="pill" id="goalName"></span>
        <div class="still">STILL TO SAVE</div>
        <div class="remaining" id="remaining">₹0</div>
        <div class="bar"><div id="barFill"></div></div>
        <div class="stats">
          <div class="stat left">
            <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="13" fill="#35c98a"/><path d="M7.5 13.5l4 4 7-8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Saved <span id="saved">₹0</span></span>
          </div>
          <div class="stat mid"><b id="pct">0.0%</b><span>Progress</span></div>
          <div class="stat right">
            <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="13" cy="15" r="11" fill="#ef4b4b"/><circle cx="13" cy="15" r="7.5" fill="#fff"/><circle cx="13" cy="15" r="4.5" fill="#ef4b4b"/><circle cx="13" cy="15" r="1.8" fill="#fff"/><path d="M13 15L24 4" stroke="#0b4d38" stroke-width="2" stroke-linecap="round"/><path d="M20 3l1 4 4 1" fill="none" stroke="#0b4d38" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Goal <span id="goalTotal">₹0</span></span>
          </div>
        </div>
      </div>
      <div class="strip" id="strip">
        <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="2" y="4" width="22" height="20" rx="4" fill="#bfe8d1"/><rect x="2" y="4" width="22" height="6" rx="3" fill="#8fd6b2"/><rect x="6" y="1.5" width="3" height="6" rx="1.5" fill="#bfe8d1"/><rect x="17" y="1.5" width="3" height="6" rx="1.5" fill="#bfe8d1"/><g fill="#0e7a52"><rect x="6" y="12" width="3" height="3" rx=".7"/><rect x="11.5" y="12" width="3" height="3" rx=".7"/><rect x="17" y="12" width="3" height="3" rx=".7"/><rect x="6" y="17.5" width="3" height="3" rx=".7"/><rect x="11.5" y="17.5" width="3" height="3" rx=".7"/><rect x="17" y="17.5" width="3" height="3" rx=".7"/></g></svg>
        <span id="info"></span>
      </div>
    </div>

    <div class="card">
      <div class="label">Add money</div>
      <div class="row" style="margin-top:12px">
        <input id="addAmt" type="number" min="1" inputmode="decimal" placeholder="Amount (₹)">
        <button class="btn-add" id="addBtn">Add</button>
      </div>
      <div class="quick">
        <button data-q="100">+100</button>
        <button data-q="500">+500</button>
        <button data-q="1000">+1000</button>
        <button data-q="5000">+5000</button>
      </div>
      <div class="note-wrap">
        <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 013 3L8 19l-4 1z" fill="#0e7a52"/><path d="M14.5 6.5l3 3" stroke="#fff" stroke-width="1.4"/></svg>
        <input id="addNote" placeholder="Note (optional)">
      </div>
    </div>

    <div class="card">
      <button class="hist-head" id="histHead" aria-expanded="true">
        <span class="label">History</span>
        <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="#3a4a43" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div id="histBody"><ul id="history"></ul></div>
    </div>

    <div class="foot">
      <button class="pbtn edit" id="editBtn">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 013 3L8 19l-4 1z" fill="#0e7a52"/><path d="M14.5 6.5l3 3" stroke="#fff" stroke-width="1.4"/></svg>
        <span>Edit goal</span>
      </button>
      <button class="pbtn danger" id="deleteBtn">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M9 7V4.5h6V7M7 7l1 13h8l1-13M10 11v6M14 11v6" fill="none" stroke="#d92d3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="deleteLabel">Delete this goal</span>
      </button>
    </div>
  </div>
</div>

<div class="toast hidden" id="toast"><span id="toastMsg"></span><button id="undoBtn">Undo</button></div>

<script>
const KEY = 'savingsCountdownV2';
const OLD_KEY = 'savingsCountdownV1';
const $ = id => document.getElementById(id);
const fmt = n => '₹' + Math.round(n).toLocaleString('en-IN');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const EMPTY_SVG = `<svg width="150" height="86" viewBox="0 0 150 86" aria-hidden="true">
  <ellipse cx="75" cy="76" rx="62" ry="7" fill="#e6f0ea"/>
  <path d="M44 14h42l14 14v38a6 6 0 01-6 6H50a6 6 0 01-6-6z" fill="#c9ead6"/>
  <path d="M86 14v11a3 3 0 003 3h11z" fill="#a9dcc0"/>
  <rect x="54" y="34" width="32" height="5" rx="2.5" fill="#10a36b"/>
  <rect x="54" y="45" width="26" height="5" rx="2.5" fill="#10a36b"/>
  <rect x="54" y="56" width="20" height="5" rx="2.5" fill="#10a36b"/>
  <circle cx="102" cy="58" r="17" fill="#0e6b4d"/>
  <circle cx="102" cy="58" r="12" fill="#e9f7ef"/>
  <path d="M102 51v8l5 3" fill="none" stroke="#0e6b4d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M112 20l3 6M118 30l6 2M122 18l1 7" stroke="#10a36b" stroke-width="2.4" stroke-linecap="round"/>
</svg>`;

let state = load();          // { goals:[{id,name,goal,date,entries:[{id,amount,note,t}]}], active:id }
let mode = state.goals.length ? null : 'new';   // null | 'new' | 'edit'
let undoInfo = null, toastTimer = null, deleteTimer = null, histOpen = true;

function load(){
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.goals)) return s;
  } catch(e){}
  try {
    const o = JSON.parse(localStorage.getItem(OLD_KEY));
    if (o && o.goal) {
      const id = uid();
      return { goals:[{ id, name:o.name||'', goal:o.goal, date:o.date||'',
        entries:(o.entries||[]).map(e => ({ id:uid(), amount:e.amount, note:e.note||'', t:e.t })) }], active:id };
    }
  } catch(e){}
  return { goals:[], active:null };
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
function cur(){ return state.goals.find(g => g.id === state.active) || null; }
const savedOf = g => g.entries.reduce((s,e) => s + e.amount, 0);

function render(){
  renderChips();
  const g = cur();
  const showSetup = mode !== null || !g;
  $('setup').classList.toggle('hidden', !showSetup);
  $('tracker').classList.toggle('hidden', showSetup);
  $('tracker').style.display = showSetup ? 'none' : 'flex';
  $('cancelBtn').classList.toggle('hidden', !state.goals.length);
  if (showSetup || !g) return;

  const saved = savedOf(g);
  const remaining = Math.max(0, g.goal - saved);
  const pct = Math.min(100, saved / g.goal * 100);

  $('goalName').textContent = g.name || 'My goal';
  $('remaining').textContent = fmt(remaining);
  $('saved').textContent = fmt(saved);
  $('goalTotal').textContent = fmt(g.goal);
  $('pct').textContent = pct.toFixed(1) + '%';
  $('barFill').style.width = pct + '%';

  let info = '';
  if (remaining === 0) info = '🎉 <b>Goal reached!</b> Well done.';
  else if (g.date) {
    const days = Math.ceil((new Date(g.date + 'T23:59:59') - new Date()) / 86400000);
    info = days > 0
      ? `<b>${days}</b> day${days>1?'s':''} left &nbsp;•&nbsp; about <b>${fmt(remaining/days)}</b>/day or <b>${fmt(remaining/Math.max(1,days/7))}</b>/week`
      : 'Target date has passed — edit the goal to set a new one.';
  }
  $('info').innerHTML = info;
  $('strip').classList.toggle('hidden', !info);

  const ul = $('history');
  ul.innerHTML = '';
  if (!g.entries.length) {
    ul.innerHTML = `<div class="empty">${EMPTY_SVG}No deposits yet. Add your first amount above.</div>`;
  } else {
    [...g.entries].reverse().forEach(e => {
      const d = new Date(e.t).toLocaleString('en-IN', {day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
      const li = document.createElement('li');
      li.innerHTML = `<div><span class="amt">+${fmt(e.amount)}</span><small>${d}${e.note ? ' · ' + esc(e.note) : ''}</small></div>
        <button class="del" data-del="${e.id}" title="Remove" aria-label="Remove deposit">✕</button>`;
      ul.appendChild(li);
    });
  }
  $('histBody').classList.toggle('hidden', !histOpen);
  $('histHead').classList.toggle('closed', !histOpen);
}

function renderChips(){
  const box = $('chips');
  box.innerHTML = '';
  state.goals.forEach(g => {
    const left = Math.max(0, g.goal - savedOf(g));
    const b = document.createElement('button');
    b.className = 'chip' + (g.id === state.active && mode === null ? ' active' : '');
    b.dataset.goal = g.id;
    b.innerHTML = `${esc(g.name || 'My goal')}<small>${left === 0 ? 'Done 🎉' : fmt(left) + ' left'}</small>`;
    box.appendChild(b);
  });
  const n = document.createElement('button');
  n.className = 'chip new'; n.id = 'newChip'; n.textContent = '+ New countdown';
  box.appendChild(n);
}

/* ---------- events ---------- */
$('chips').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'newChip') { openSetup('new'); return; }
  state.active = b.dataset.goal; mode = null; save(); render();
});

function openSetup(m){
  mode = m;
  const g = cur();
  if (m === 'edit' && g) {
    $('setupTitle').textContent = 'Edit goal';
    $('gName').value = g.name; $('gAmt').value = g.goal; $('gDate').value = g.date;
    $('startBtn').textContent = 'Save changes';
  } else {
    $('setupTitle').textContent = 'New countdown';
    $('gName').value = ''; $('gAmt').value = ''; $('gDate').value = '';
    $('startBtn').textContent = 'Start saving';
  }
  render();
}

$('startBtn').onclick = () => {
  const goal = parseFloat($('gAmt').value);
  if (!(goal > 0)) { $('gAmt').focus(); $('gAmt').style.outline = '2px solid var(--danger)'; return; }
  $('gAmt').style.outline = '';
  const data = { name: $('gName').value.trim(), goal, date: $('gDate').value || '' };
  if (mode === 'edit' && cur()) Object.assign(cur(), data);
  else { const id = uid(); state.goals.push({ id, ...data, entries: [] }); state.active = id; }
  mode = null; save(); render();
};
$('cancelBtn').onclick = () => { mode = null; render(); };
$('editBtn').onclick = () => openSetup('edit');
$('histHead').onclick = () => { histOpen = !histOpen; $('histHead').setAttribute('aria-expanded', histOpen); render(); };

function addMoney(amount){
  const g = cur();
  if (!g) return;
  if (!(amount > 0)) { $('addAmt').focus(); return; }
  g.entries.push({ id: uid(), amount, note: $('addNote').value.trim(), t: Date.now() });
  $('addAmt').value = ''; $('addNote').value = '';
  save(); render();
}
$('addBtn').onclick = () => addMoney(parseFloat($('addAmt').value));
$('addAmt').addEventListener('keydown', e => { if (e.key === 'Enter') $('addBtn').click(); });
document.querySelectorAll('[data-q]').forEach(b => b.onclick = () => addMoney(parseFloat(b.dataset.q)));

// remove a deposit (delegation + undo, no popup)
$('history').addEventListener('click', e => {
  const b = e.target.closest('[data-del]'); if (!b) return;
  const g = cur(); if (!g) return;
  const idx = g.entries.findIndex(x => x.id === b.dataset.del);
  if (idx < 0) return;
  const [removed] = g.entries.splice(idx, 1);
  undoInfo = { goalId: g.id, entry: removed };
  save(); render();
  showToast(`Removed ${fmt(removed.amount)}`);
});

function showToast(msg){
  $('toastMsg').textContent = msg;
  $('toast').classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 6000);
}
function hideToast(){ $('toast').classList.add('hidden'); undoInfo = null; }
$('undoBtn').onclick = () => {
  if (!undoInfo) return;
  const g = state.goals.find(x => x.id === undoInfo.goalId);
  if (g) { g.entries.push(undoInfo.entry); g.entries.sort((a,b) => a.t - b.t); save(); }
  hideToast(); render();
};

// delete goal: tap twice to confirm
$('deleteBtn').onclick = () => {
  const btn = $('deleteBtn');
  if (!btn.classList.contains('armed')) {
    btn.classList.add('armed'); $('deleteLabel').textContent = 'Tap again to confirm';
    clearTimeout(deleteTimer);
    deleteTimer = setTimeout(disarm, 3000);
    return;
  }
  disarm();
  state.goals = state.goals.filter(g => g.id !== state.active);
  state.active = state.goals.length ? state.goals[0].id : null;
  mode = state.goals.length ? null : 'new';
  save();
  if (mode === 'new') openSetup('new'); else render();
};
function disarm(){
  $('deleteBtn').classList.remove('armed'); $('deleteLabel').textContent = 'Delete this goal';
  clearTimeout(deleteTimer);
}

if (!cur() && state.goals.length) state.active = state.goals[0].id;
if (mode === 'new') openSetup('new'); else render();
setInterval(() => { if (mode === null) render(); }, 60000);
</script>
</body>
</html>
